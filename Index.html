<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DrivePrep — US Driving Test Practice</title>
<style>
:root{
  --bg:#f2f5f9; --card:#ffffff; --ink:#17212b; --sub:#5a6675; --line:#e3e8ee;
  --accent:#2b59d8; --accent-soft:#e8eefc; --violet:#6f42c1;
  --ok:#2b8a3e; --ok-bg:#e9f6ec; --bad:#c92a2a; --bad-bg:#fdecec;
  --gold:#f59f00; --gold-bg:#fff4d6; --chip:#eef1f6;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f141b; --card:#171e28; --ink:#e8edf4; --sub:#94a2b3; --line:#273240;
    --accent:#6d94ff; --accent-soft:#1d2a45; --violet:#a084e8;
    --ok:#69c57c; --ok-bg:#15301c; --bad:#ff8787; --bad-bg:#3a1a1a;
    --gold:#ffc94d; --gold-bg:#3a2f12; --chip:#212b37;
  }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px; line-height:1.5;
}
#top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
header{max-width:820px;margin:0 auto;padding:12px 16px 6px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-weight:800;font-size:18px;display:flex;align-items:center;gap:8px}
.brand small{font-weight:600;color:var(--sub);font-size:12px}
.gems{font-weight:800;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:15px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.gems.pop{animation:pop .4s ease}
nav{max-width:820px;margin:0 auto;padding:4px 10px 10px;display:flex;gap:6px;overflow-x:auto}
nav::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;color:var(--sub);font:inherit;font-weight:700;font-size:14px;padding:8px 12px;border-radius:10px;cursor:pointer;white-space:nowrap}
.tab.active{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
main{max-width:820px;margin:0 auto;padding:18px 16px 60px}
footer{max-width:820px;margin:0 auto;padding:0 16px 40px;color:var(--sub);font-size:12.5px}
h1{font-size:26px;margin:0 0 6px}
h2{font-size:19px;margin:0 0 4px}
h3{font-size:16px;margin:0 0 4px}
p{margin:6px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.hero{background:linear-gradient(135deg,#2b59d8,#6f42c1);border:0;color:#fff}
.hero p{color:#e6ebff}
.statrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.stat{background:rgba(255,255,255,.16);border-radius:10px;padding:6px 12px;font-size:13.5px;font-weight:700}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
@media (max-width:620px){.modes{grid-template-columns:1fr}}
.mode{display:flex;gap:14px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;font:inherit;color:var(--ink);transition:transform .12s ease,box-shadow .12s ease}
.mode:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.08)}
.mode .ic{font-size:26px;background:var(--accent-soft);border-radius:14px;width:52px;height:52px;display:grid;place-items:center;flex:none}
.mode b{display:block;font-size:16px}
.mode span{color:var(--sub);font-size:13.5px}
.note{color:var(--sub);font-size:13.5px}
.btn{display:inline-block;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;font-size:15px;padding:12px 18px;border-radius:12px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.block{display:block;width:100%;text-align:center;margin-top:12px}
.btn:disabled{opacity:.45;cursor:default}
.btn.subtle{font-size:13.5px;padding:8px 12px;color:var(--sub)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);font:inherit;font-size:13.5px;font-weight:700;padding:8px 12px;border-radius:999px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip .stars{font-size:11px;color:var(--gold);margin-left:4px}
.chip.on .stars{color:#ffe08a}
.qtop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.qtop .title{font-weight:800;font-size:15px}
.qtop .meta{color:var(--sub);font-size:13px;font-weight:700;display:flex;gap:10px;align-items:center}
.flame{color:#e8590c;animation:flame 1s ease infinite}
.pbar{height:8px;background:var(--chip);border-radius:99px;overflow:hidden;margin-bottom:16px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--violet));border-radius:99px;transition:width .3s ease}
.question{font-size:18.5px;font-weight:700;margin:8px 0 14px}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1.6px solid var(--line);border-radius:13px;background:var(--card);color:var(--ink);font:inherit;font-size:15.5px;text-align:left;cursor:pointer;transition:border-color .1s ease,background .1s ease}
.choice:hover{border-color:var(--accent)}
.choice .key{flex:none;width:28px;height:28px;border-radius:9px;background:var(--chip);display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--sub)}
.choices.locked .choice{pointer-events:none}
.choice.correct{border-color:var(--ok);background:var(--ok-bg);animation:pop .35s ease}
.choice.correct .key{background:var(--ok);color:#fff}
.choice.wrong{border-color:var(--bad);background:var(--bad-bg);animation:shake .4s ease}
.choice.wrong .key{background:var(--bad);color:#fff}
.choice.dim{opacity:.55}
.feedback{position:relative;margin-top:14px;border-radius:14px;padding:14px 16px;animation:pop .3s ease}
.feedback.ok{background:var(--ok-bg);border:1px solid var(--ok)}
.feedback.bad{background:var(--bad-bg);border:1px solid var(--bad)}
.feedback b{font-size:15.5px}
.feedback p{font-size:14.5px;margin:8px 0 0}
.gemfloat{position:absolute;right:14px;top:-8px;font-weight:800;color:var(--gold);animation:floatup 1.4s ease forwards;pointer-events:none}
.varybadge{display:inline-block;background:var(--gold-bg);color:#8a6100;border:1px solid var(--gold);font-size:11.5px;font-weight:800;padding:2px 9px;border-radius:999px;margin-top:8px}
@media (prefers-color-scheme: dark){.varybadge{color:var(--gold)}}
.signbox{background:#fbfbf8;border:1px solid #dcdfd8;border-radius:14px;display:grid;place-items:center;padding:12px}
.signbox svg{width:120px;height:120px;display:block}
.qsign{margin:0 auto 14px;width:170px}
.qsign svg{width:146px;height:146px}
.signgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:10px}
.signcell{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:10px;cursor:pointer;font:inherit;color:var(--ink);text-align:center}
.signcell .signbox{padding:6px;margin-bottom:8px}
.signcell .signbox svg{width:92px;height:92px}
.signcell b{font-size:13px;display:block}
.signcell small{color:var(--sub);font-size:12px;display:block;margin-top:4px}
.flashwrap{text-align:center}
.flashwrap .signbox{width:230px;margin:6px auto 14px;padding:22px}
.flashwrap .signbox svg{width:170px;height:170px}
.flashrow{display:flex;gap:10px;justify-content:center;margin-top:12px}
.check{display:flex;align-items:flex-start;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.check:last-of-type{border-bottom:0}
.check input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent);flex:none}
.check span{font-size:15px}
.check input:checked + span{color:var(--sub);text-decoration:line-through}
.handsigs{display:flex;gap:14px;justify-content:space-around;flex-wrap:wrap;margin-top:10px}
.handsig{text-align:center;color:var(--sub);font-size:12.5px;font-weight:700}
.handsig svg{display:block;margin:0 auto 4px;color:var(--ink)}
.mrow{display:flex;align-items:center;gap:14px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;cursor:pointer;font:inherit;color:var(--ink);text-align:left}
.mrow .ic{font-size:22px}
.mrow b{display:block;font-size:15.5px}
.mrow span{color:var(--sub);font-size:13px}
.mrow .go{margin-left:auto;color:var(--accent);font-weight:800}
.stepnum{color:var(--sub);font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.4px}
.steptext{font-size:19px;font-weight:700;margin:10px 0 18px;min-height:86px}
.dots{display:flex;gap:6px;margin-bottom:16px}
.dots i{width:8px;height:8px;border-radius:99px;background:var(--chip)}
.dots i.on{background:var(--accent)}
.steprow{display:flex;gap:10px}
.steprow .btn{flex:1}
.tips{background:var(--gold-bg);border:1px solid var(--gold);border-radius:12px;padding:12px 14px;font-size:14px;margin-top:14px}
.failitem{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.failitem:last-child{border-bottom:0}
.failitem .ic{flex:none}
.failitem b{display:block;font-size:15px}
.failitem span{color:var(--sub);font-size:13.5px}
.result{text-align:center;padding:26px 20px}
.result .big{font-size:52px}
.result h2{font-size:24px;margin:8px 0 2px}
.result .score{font-size:40px;font-weight:800;margin:8px 0}
.result .sub{color:var(--sub);font-size:14px}
.catline{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:14px}
.catline .lbl{flex:1}
.catline .bar{flex:2;height:8px;background:var(--chip);border-radius:99px;overflow:hidden}
.catline .bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.catline .pct{width:74px;text-align:right;color:var(--sub);font-weight:700;font-size:13px}
.catline .stars{width:52px;color:var(--gold);font-size:12px;letter-spacing:1px}
.missitem{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px;text-align:left;font-size:14px}
.missitem .ans{margin:6px 0;font-size:13.5px}
.missitem .exp{color:var(--sub);font-size:13.5px}
.histchips{display:flex;flex-wrap:wrap;gap:8px}
.histchip{border:1px solid var(--line);background:var(--chip);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:700}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.statcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.statcard b{font-size:24px;display:block}
.statcard span{color:var(--sub);font-size:12.5px;font-weight:700}
.empty{text-align:center;color:var(--sub);padding:30px 10px}
.empty .big{font-size:40px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:99;overflow:hidden}
.confetti i{position:absolute;top:-24px;display:block;border-radius:2px;animation:fall linear forwards}
@keyframes pop{0%{transform:scale(.94)}55%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes shake{10%,90%{transform:translateX(-2px)}25%,75%{transform:translateX(4px)}50%{transform:translateX(-4px)}}
@keyframes floatup{0%{opacity:0;transform:translateY(10px) scale(.8)}18%{opacity:1}100%{opacity:0;transform:translateY(-44px) scale(1.2)}}
@keyframes fall{to{transform:translateY(108vh) rotate(680deg)}}
@keyframes flame{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
@media (prefers-reduced-motion: reduce){
  *{animation:none !important;transition:none !important}
}
</style>
</head>
<body>
<div id="top">
  <header>
    <div class="brand">🚗 DrivePrep <small>US theory + road test</small></div>
    <div class="gems" id="gemwrap">💎 <span id="gems">0</span></div>
  </header>
  <nav id="tabs">
    <button class="tab" data-action="nav" data-screen="home">🏠 Home</button>
    <button class="tab" data-action="nav" data-screen="theory">📖 Theory</button>
    <button class="tab" data-action="nav" data-screen="signs">🛑 Signs</button>
    <button class="tab" data-action="nav" data-screen="practical">🚗 Road test</button>
    <button class="tab" data-action="nav" data-screen="progress">📊 Progress</button>
  </nav>
</div>
<main id="app"><noscript>DrivePrep needs JavaScript enabled.</noscript></main>
<footer>Practice tool — not affiliated with any DMV. Built on the common core of US driving rules; details vary by state, and your state's official driver handbook is the final word. Progress is stored only in this browser.</footer>
<script>
'use strict';
/* ---------------- helpers ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shuffle(arr){ const a = arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
const PARAMS = new URLSearchParams(location.search);
const SELFTEST = PARAMS.has('selftest');
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const fmtTime = ms => { const s=Math.floor(ms/1000); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };

/* ---------------- road sign artwork ---------------- */
const SW = 'stroke="#1b1b1b" stroke-width="4" stroke-linejoin="round"';
const IC = 'fill="none" stroke="#1b1b1b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"';
const txt = (x,y,s,str,fill,w,extra) => `<text x="${x}" y="${y}" font-size="${s}" font-weight="${w||800}" fill="${fill||'#fff'}" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" ${extra||''}>${str}</text>`;
const ah = (x,y,r) => `<polygon points="0,-10 8,8 -8,8" transform="translate(${x} ${y}) rotate(${r||0})" fill="#1b1b1b"/>`;
const dia = (inner,fill) => `<rect x="20" y="20" width="80" height="80" rx="9" transform="rotate(45 60 60)" fill="${fill||'#FFCD00'}" ${SW}/>` + inner;
const wsq = inner => `<rect x="10" y="10" width="100" height="100" rx="10" fill="#fff" ${SW}/>` + inner;
const NOSLASH = '<circle cx="60" cy="60" r="42" fill="none" stroke="#BF0A30" stroke-width="8"/><line x1="31" y1="31" x2="89" y2="89" stroke="#BF0A30" stroke-width="8"/>';
const walker = (x,y,sc) => `<g transform="translate(${x} ${y}) scale(${sc||1})"><circle cx="0" cy="-26" r="7" fill="#1b1b1b"/><g ${IC}><path d="M0,-18 L-2,4"/><path d="M-2,4 L-12,26 M-2,4 L10,24"/><path d="M-1,-12 L12,-2"/></g></g>`;

const SIGNS = [
 {id:'stop', name:'Stop', meaning:'Come to a complete stop, then go when it is safe',
  svg:'<polygon points="111.7,81.4 81.4,111.7 38.6,111.7 8.3,81.4 8.3,38.6 38.6,8.3 81.4,8.3 111.7,38.6" fill="#BF0A30" stroke="#fff" stroke-width="6"/>'+txt(60,71,30,'STOP')},
 {id:'yield', name:'Yield', meaning:'Slow down and give the right of way; stop if needed',
  svg:'<polygon points="60,112 8,18 112,18" fill="#BF0A30" stroke="#fff" stroke-width="4"/><polygon points="60,97 24,26 96,26" fill="#fff"/>'+txt(60,49,17,'YIELD','#BF0A30')},
 {id:'donotenter', name:'Do Not Enter', meaning:'Do not enter — this road is closed to traffic in your direction',
  svg:wsq('<circle cx="60" cy="60" r="46" fill="#BF0A30"/><rect x="26" y="53" width="68" height="14" rx="3" fill="#fff"/>')},
 {id:'wrongway', name:'Wrong Way', meaning:'You are driving against traffic — pull over safely and turn around',
  svg:'<rect x="4" y="30" width="112" height="60" rx="8" fill="#BF0A30" stroke="#fff" stroke-width="4"/>'+txt(60,58,20,'WRONG')+txt(60,81,20,'WAY')},
 {id:'speed50', name:'Speed Limit', meaning:'Maximum legal speed under ideal conditions',
  svg:'<rect x="22" y="8" width="76" height="104" rx="8" fill="#fff" '+SW+'/>'+txt(60,32,14,'SPEED','#1b1b1b')+txt(60,50,14,'LIMIT','#1b1b1b')+txt(60,98,42,'50','#1b1b1b')},
 {id:'school', name:'School Zone', meaning:'School zone or crossing — slow down and watch for children',
  svg:'<polygon points="60,6 112,45 93,112 27,112 8,45" fill="#CEDC00" '+SW+'/>'+walker(46,72,1)+walker(76,76,0.85)},
 {id:'pedx', name:'Pedestrian Crossing', meaning:'Pedestrian crossing ahead — be ready to stop for people on foot',
  svg:dia(walker(60,66,1.2))},
 {id:'rr', name:'Railroad Crossing Ahead', meaning:'Railroad crossing ahead — slow down, look, and listen',
  svg:'<circle cx="60" cy="60" r="52" fill="#FFCD00" '+SW+'/><line x1="34" y1="34" x2="86" y2="86" stroke="#1b1b1b" stroke-width="9"/><line x1="86" y1="34" x2="34" y2="86" stroke="#1b1b1b" stroke-width="9"/>'+txt(26,69,22,'R','#1b1b1b')+txt(94,69,22,'R','#1b1b1b')},
 {id:'signal', name:'Traffic Signal Ahead', meaning:'Traffic signal ahead — be ready to stop',
  svg:dia('<rect x="47" y="25" width="26" height="58" rx="7" fill="#1b1b1b"/><circle cx="60" cy="38" r="7" fill="#E03131"/><circle cx="60" cy="54" r="7" fill="#FFD43B"/><circle cx="60" cy="70" r="7" fill="#2F9E44"/>')},
 {id:'merge', name:'Merge', meaning:'Traffic merges from the side ahead — adjust speed to let them in',
  svg:dia('<path d="M52,94 V42" '+IC+'/><path d="M84,90 C84,66 66,62 57,52" '+IC+'/>'+ah(52,36,0))},
 {id:'twoway', name:'Two-Way Traffic', meaning:'Two-way traffic ahead — oncoming cars share this road',
  svg:dia('<path d="M48,88 V46" '+IC+'/>'+ah(48,38,0)+'<path d="M72,32 V74" '+IC+'/>'+ah(72,82,180))},
 {id:'divided', name:'Divided Highway', meaning:'Divided highway ahead — keep to the right of the median',
  svg:dia('<ellipse cx="60" cy="62" rx="7" ry="20" fill="#1b1b1b"/><path d="M44,92 C44,72 42,62 46,46" '+IC+'/>'+ah(47,39,0)+'<path d="M76,92 C76,72 78,62 74,46" '+IC+'/>'+ah(74,39,0))},
 {id:'crossroad', name:'Crossroad Ahead', meaning:'A road crosses ahead — watch for entering and crossing traffic',
  svg:dia('<path d="M60,28 V92 M28,60 H92" fill="none" stroke="#1b1b1b" stroke-width="9" stroke-linecap="round"/>')},
 {id:'curve', name:'Curve Right', meaning:'The road curves right ahead — slow down before the curve',
  svg:dia('<path d="M50,94 C50,68 52,58 68,47" '+IC+'/>'+ah(72,45,58))},
 {id:'winding', name:'Winding Road', meaning:'Winding road ahead — a series of curves',
  svg:dia('<path d="M58,96 C40,86 76,72 60,58 C46,46 70,38 59,26" '+IC+'/>'+ah(58,23,-12))},
 {id:'laneends', name:'Lane Ends', meaning:'The right lane ends ahead — merge left',
  svg:dia('<path d="M44,26 V94" '+IC+'/><path d="M78,94 C78,66 76,56 52,44" '+IC+'/>')},
 {id:'nouturn', name:'No U-Turn', meaning:'U-turns are not allowed here',
  svg:wsq('<path d="M42,84 V54 a18,18 0 0 1 36,0 V76" '+IC+'/>'+ah(78,82,180)+NOSLASH)},
 {id:'noleft', name:'No Left Turn', meaning:'Left turns are not allowed here',
  svg:wsq('<path d="M80,88 V68 Q80,58 70,58 L52,58" '+IC+'/>'+ah(46,58,-90)+NOSLASH)},
 {id:'oneway', name:'One Way', meaning:'Traffic flows only in the direction of the arrow',
  svg:'<rect x="4" y="40" width="112" height="40" rx="7" fill="#14171a" stroke="#fff" stroke-width="3"/><polygon points="12,60 44,44 44,53 106,53 106,67 44,67 44,76" fill="#fff"/>'+txt(73,64,10,'ONE WAY','#14171a',900)},
 {id:'keepright', name:'Keep Right', meaning:'Keep right of the divider or obstruction ahead',
  svg:wsq('<rect x="38" y="66" width="12" height="32" fill="#1b1b1b"/><path d="M52,30 C80,36 82,52 82,72 V84" '+IC+'/>'+ah(82,90,180))},
 {id:'pennant', name:'No Passing Zone', meaning:'A no-passing zone begins — do not pass other vehicles',
  svg:'<polygon points="10,22 10,98 112,60" fill="#FFCD00" '+SW+'/>'+txt(40,52,12,'NO','#1b1b1b')+txt(44,67,10,'PASSING','#1b1b1b')+txt(40,82,10,'ZONE','#1b1b1b')},
 {id:'roadwork', name:'Road Work Ahead', meaning:'Work zone ahead — slow down and expect workers and equipment',
  svg:dia(txt(60,50,13,'ROAD','#1b1b1b')+txt(60,67,13,'WORK','#1b1b1b')+txt(60,84,13,'AHEAD','#1b1b1b'),'#F76900')},
 {id:'detour', name:'Detour', meaning:'Detour — follow the arrow to the alternate route',

/* ---------------- persistence ---------------- */
const PKEY = 'dtp-v1';
function freshP(){ return {gems:0, best:0, q:{}, missed:[], exams:[], checks:{}}; }
let P = (function(){ try{ const r=JSON.parse(localStorage.getItem(PKEY)); if(r && typeof r==='object') return Object.assign(freshP(), r); }catch(e){} return freshP(); })();
function save(){ if(SELFTEST) return; try{ localStorage.setItem(PKEY, JSON.stringify(P)); }catch(e){} }

function record(id, ok){
  const st = P.q[id] || (P.q[id]=[0,0]);
  st[ok?0:1]++;
  const mi = P.missed.indexOf(id);
  if(ok){ if(mi>-1) P.missed.splice(mi,1); }
  else if(mi<0) P.missed.push(id);
  save();
}
function addGems(n){ P.gems += n; P.gems = Math.max(0,P.gems); save(); const g=$('#gems'); if(g){ g.textContent=P.gems; const w=$('#gemwrap'); w.classList.remove('pop'); void w.offsetWidth; w.classList.add('pop'); } }

function catStat(c){
  const qs = QDATA.filter(q=>q.c===c);
  let r=0,w=0,seen=0;
  qs.forEach(q=>{ const st=P.q[q.id]; if(st){ seen++; r+=st[0]; w+=st[1]; } });
  const acc = (r+w) ? r/(r+w) : 0;
  const cov = qs.length ? seen/qs.length : 0;
  let stars = 0;
  if(seen){ if(acc>=.5 && cov>=.25) stars=1; if(acc>=.7 && cov>=.5) stars=2; if(acc>=.85 && cov>=.8) stars=3; }
  return {n:qs.length, seen, r, w, acc, cov, stars};
}
function starStr(n){ return '★'.repeat(n) + '☆'.repeat(3-n); }
function totals(){ let r=0,w=0; Object.keys(P.q).forEach(k=>{ r+=P.q[k][0]; w+=P.q[k][1]; }); return {r,w,answered:r+w}; }

function startPractice(cat, poolIds, title){
  const pool = shuffle(poolIds || poolFor(cat));
  if(!pool.length) return;
  S.quiz = { pool, i:0, right:0, wrong:0, streak:0, sessMiss:[], done:false,
             title: title || (cat==='all' ? 'All categories' : (CATS[cat]? CATS[cat][1] : 'Practice')) };
  loadPQ(); go('quiz');
}
function loadPQ(){ const q=QMAP[S.quiz.pool[S.quiz.i]]; S.quiz.cur=q; S.quiz.opts=shuffle(q.ch.map((c,i)=>({c,i}))); S.quiz.ans=null; S.quiz.lastGain=0; }
function answerPractice(pos){
  const z=S.quiz; if(!z || z.ans!=null || z.done) return;
  z.ans = pos;
  const ok = z.opts[pos].i === z.cur.a;
  record(z.cur.id, ok);
  if(ok){
    z.right++; z.streak++;
    if(z.streak > P.best){ P.best = z.streak; }
    const bonus = z.streak>=10 ? 20 : z.streak>=5 ? 10 : z.streak>=3 ? 5 : 0;
    z.lastGain = 10 + bonus;
    addGems(z.lastGain);
  } else { z.wrong++; z.streak=0; z.sessMiss.push(z.cur.id); save(); }
  render(false);
  const fb=$('.feedback'); if(fb && !REDUCED) fb.scrollIntoView({block:'nearest', behavior:'smooth'});
}
function nextPractice(){
  const z=S.quiz; if(!z || z.ans==null) return;
  z.i++;
  if(z.i >= z.pool.length){ z.done=true; render(true); }
  else { loadPQ(); render(true); }
}

let EXTIMER = null;
function startExam(){
  const t = shuffle(QDATA.filter(q=>THEORY.includes(q.c)).map(q=>q.id)).slice(0,20);
  const g = shuffle(QDATA.filter(q=>q.c==='signid').map(q=>q.id)).slice(0,5);
  S.exam = { pool:shuffle(t.concat(g)), i:0, answers:[], start:Date.now(), done:false, score:0 };
  loadEQ(); go('exam');
  clearInterval(EXTIMER);
  EXTIMER = setInterval(()=>{
    if(!S.exam || S.exam.done || S.screen!=='exam'){ clearInterval(EXTIMER); return; }
    const el=$('#extime'); if(el) el.textContent = fmtTime(Date.now()-S.exam.start);
  }, 1000);
}
function loadEQ(){ const q=QMAP[S.exam.pool[S.exam.i]]; S.exam.cur=q; S.exam.opts=shuffle(q.ch.map((c,i)=>({c,i}))); S.exam.ans=null; }
function answerExam(pos){
  const e=S.exam; if(!e || e.ans!=null || e.done) return;
  e.ans = pos;
  const ok = e.opts[pos].i === e.cur.a;
  record(e.cur.id, ok);
  e.answers.push({id:e.cur.id, ok, sel:e.opts[pos].i});
  render(false);
  if(SELFTEST){ advanceExam(); } else { setTimeout(advanceExam, 450); }
}
function advanceExam(){
  const e=S.exam; if(!e || e.done || S.screen!=='exam') return;
  e.i++;
  if(e.i >= e.pool.length){ finishExam(); } else { loadEQ(); render(true); }
}
function finishExam(){
  const e=S.exam;
  e.done = true;
  e.elapsed = Date.now()-e.start;
  e.score = e.answers.filter(a=>a.ok).length;
  e.pass = e.score >= Math.ceil(e.pool.length*0.8);
  P.exams.push({t:Date.now(), s:e.score, n:e.pool.length, p:e.pass});
  save();
  addGems(4*e.score + (e.pass?100:0));
  render(true);
  if(e.pass && !REDUCED && !SELFTEST) confetti();
}

function flashMark(knew){
  const f=S.flash; if(!f || !f.revealed) return;
  if(knew){ f.knew++; addGems(2); } else { f.again++; f.deck.push(f.deck[f.i]); }

}

function confetti(){
  const c=document.createElement('div'); c.className='confetti';
  const colors=['#2b59d8','#f7b500','#e8590c','#2f9e44','#be4bdb','#e03131'];
  for(let i=0;i<90;i++){
    const s=document.createElement('i');
    s.style.left=(Math.random()*100)+'vw';
    s.style.background=colors[i%colors.length];
    const z=6+Math.random()*8;
    s.style.width=z+'px'; s.style.height=(z*0.55)+'px';
    s.style.animationDuration=(2.4+Math.random()*1.8)+'s';
    s.style.animationDelay=(Math.random()*0.6)+'s';
    c.appendChild(s);
  }
  document.body.appendChild(c);
  setTimeout(()=>c.remove(), 5200);
}

function choiceBtns(opts, ans, correctIdx){
  const locked = ans!=null;
  let h='<div class="choices'+(locked?' locked':'')+'">';
  opts.forEach((o,pos)=>{
    let cls='choice';
    if(locked){
      if(o.i===correctIdx) cls+=' correct';
      else if(pos===ans) cls+=' wrong';
      else cls+=' dim';
    }
    h+='<button class="'+cls+'" data-action="answer" data-pos="'+pos+'"><span class="key">'+String.fromCharCode(65+pos)+'</span><span>'+esc(o.c)+'</span></button>';
  });
  return h+'</div>';
}

    body='<section class="card"><h2>📋 Test-day checklist</h2><p class="note">Check these off the night before — missing paperwork is the most preventable way to lose a test slot.</p>'+
      checklist('testday', TESTDAY)+'</section>'+
      '<section class="card note">🧘 On the drive: narrating your checks in your head ("mirror… shoulder… clear") keeps your pace calm and makes every check visible to the examiner. Slow, obvious, boring driving is exactly what passes.</section>';
  }
  return '<section class="card hero" style="padding:14px 20px"><h2 style="margin:0">🚗 Road test prep</h2></section>'+tabs+body;
}

function vProgress(){
  const t=totals();
  if(!t.answered && !P.exams.length){
    return '<section class="card empty"><div class="big">🌱</div><h2>Nothing here yet</h2><p class="note">Answer a few questions and this turns into your weak-spot radar.</p><button class="btn primary" data-action="nav" data-screen="theory">Start practicing →</button></section>';
  }
  let cats='';
  let weakest=null;
  Object.keys(CATS).forEach(c=>{
    const st=catStat(c);
    if(!st.seen) { cats+='<div class="catline"><span class="lbl">'+CATS[c][0]+' '+esc(CATS[c][1])+'</span><span class="bar"><i style="width:0"></i></span><span class="pct">—</span><span class="stars">'+starStr(0)+'</span></div>'; return; }
    const pct=Math.round(100*st.acc);
    if((st.r+st.w)>=5 && (!weakest || st.acc < weakest.acc)) weakest={c, acc:st.acc};
    cats+='<div class="catline"><span class="lbl">'+CATS[c][0]+' '+esc(CATS[c][1])+'</span><span class="bar"><i style="width:'+pct+'%"></i></span><span class="pct">'+pct+'% ('+(st.r+st.w)+')</span><span class="stars">'+starStr(st.stars)+'</span></div>';
  });
  let hist='';
  P.exams.slice(-10).reverse().forEach(e=>{
    hist+='<span class="histchip">'+(e.p?'✅':'❌')+' '+e.s+'/'+e.n+' · '+new Date(e.t).toLocaleDateString(undefined,{month:'short',day:'numeric'})+'</span>';
  });
  return (
  '<div class="statgrid">'+
   '<div class="statcard"><b>💎 '+P.gems+'</b><span>gems</span></div>'+
   '<div class="statcard"><b>🔥 '+P.best+'</b><span>best streak</span></div>'+
   '<div class="statcard"><b>'+Math.round(100*t.r/Math.max(1,t.answered))+'%</b><span>accuracy · '+t.answered+' answered</span></div>'+
   '<div class="statcard"><b>'+Object.keys(P.q).length+'/'+QDATA.length+'</b><span>questions seen</span></div>'+
  '</div>'+
  '<section class="card"><h2>Mastery by category</h2><p class="note">Stars need both accuracy and coverage: ★ 50%+, ★★ 70%+, ★★★ 85%+ across most of the category.</p>'+cats+
  (weakest? '<div class="tips" style="margin-top:12px">🎯 Weakest area right now: <b>'+esc(CATS[weakest.c][1])+'</b> — worth one focused practice run.</div>':'')+
  '</section>'+
  (P.exams.length? '<section class="card"><h2>Exam history</h2><div class="histchips">'+hist+'</div></section>':'')+
  '<section class="card"><h2>Cram tools</h2>'+
   '<button class="btn primary block" data-action="start-missed" '+(P.missed.length?'':'disabled')+'>'+(P.missed.length? 'Practice all '+P.missed.length+' missed questions →':'No open misses — nice')+'</button>'+
   '<button class="btn block" data-action="reset-progress">'+(S.confirmReset? 'Really wipe everything? Tap again':'Reset all progress')+'</button>'+
  '</section>');
}

/* ---------------- render ---------------- */
const VIEWS = {home:vHome, theory:vTheory, quiz:vQuiz, exam:vExam, signs:vSigns, practical:vPractical, progress:vProgress};
function navKey(){ return (S.screen==='quiz'||S.screen==='exam') ? 'theory' : S.screen; }
function render(scrollTop){
  const v = VIEWS[S.screen] || vHome;
  $('#app').innerHTML = v();
  $('#gems').textContent = P.gems;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.screen===navKey()));
  if(scrollTop && S.lastScreen!==null) window.scrollTo(0,0);
  S.lastScreen = S.screen;
}

/* ---------------- events ---------------- */
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const d = el.dataset;
  switch(d.action){
    case 'nav': go(d.screen); break;
    case 'pick-cat': S.cat=d.cat; render(false); break;
    case 'start-practice': startPractice(S.cat); break;
    case 'start-missed': if(P.missed.length) startPractice(null, P.missed.slice(), 'Missed questions'); break;
    case 'start-scenarios': startPractice('practical'); break;
    case 'start-signquiz': startPractice('signid'); break;
    case 'start-exam': startExam(); break;
    case 'answer': if(S.screen==='quiz') answerPractice(+d.pos); else if(S.screen==='exam') answerExam(+d.pos); break;
    case 'next-q': nextPractice(); break;
    case 'end-quiz': if(S.quiz){ S.quiz.done=true; render(true); } break;
    case 'retry-sess': startPractice(null, S.quiz.sessMiss.slice(), 'This session\'s misses'); break;
    case 'quit-exam': S.exam=null; go('theory'); break;
    case 'practice-exam-miss': startPractice(null, S.exam.answers.filter(a=>!a.ok).map(a=>a.id), 'Exam misses'); break;
    case 'sign-tab': S.signTab=d.tab; render(true); break;
    case 'toggle-sign': S.openSign = (S.openSign===d.sign? null : d.sign); render(false); break;
    case 'flash-start': startFlash(); break;
    case 'flash-reveal': if(S.flash){ S.flash.revealed=true; render(false); } break;
    case 'flash-mark': flashMark(d.know==='1'); break;
    case 'ptab': S.pTab=d.tab; S.manOpen=null; render(true); break;
    case 'man-open': S.manOpen=d.man; S.manStep=0; render(true); break;
    case 'man-step': S.manStep=Math.max(0, S.manStep + (+d.dir)); render(false); break;
    case 'man-close': S.manOpen=null; render(true); break;
    case 'reset-checks': delete P.checks[d.group]; save(); render(false); break;
    case 'reset-progress':
      if(S.confirmReset){ P=freshP(); save(); S.confirmReset=false; }
      else S.confirmReset=true;
      render(false); break;
  }
});
document.addEventListener('change', e=>{
  const el = e.target.closest('[data-check]');
  if(!el) return;
  const g = el.dataset.group;
  P.checks[g] = P.checks[g] || {};
  P.checks[g][el.dataset.idx] = el.checked;
  save(); render(false);
});
document.addEventListener('keydown', e=>{
  const active = S.screen==='quiz' ? S.quiz : S.screen==='exam' ? S.exam : null;
  if(!active || active.done) return;
  if(active.ans==null && e.key>='1' && e.key<='4'){
    const pos = +e.key-1;
    if(pos < active.opts.length){ if(S.screen==='quiz') answerPractice(pos); else answerExam(pos); }
  } else if(S.screen==='quiz' && active.ans!=null && (e.key==='Enter' || e.key===' ' || e.key==='n')){
    e.preventDefault(); nextPractice();
  }
});

/* ---------------- boot ---------------- */
(function init(){
  const h = location.hash.slice(1);
  if(MAIN.includes(h)) S.screen=h;
  render(false);
  const demo = PARAMS.get('demo');
  if(demo==='quiz'){ startPractice('all'); }
  else if(demo==='quizfb'){ startPractice('all'); const z=S.quiz; let pos=z.opts.findIndex(o=>o.i!==z.cur.a); answerPractice(pos); }
  else if(demo==='quizok'){ startPractice('all'); const z=S.quiz; let pos=z.opts.findIndex(o=>o.i===z.cur.a); answerPractice(pos); }
  else if(demo==='exam'){ startExam(); }
  if(SELFTEST) selftest();
})();

/* ---------------- selftest ---------------- */
function selftest(){
  const errs=[];
  try{
    const ids=new Set();
    QDATA.forEach(q=>{
      if(ids.has(q.id)) errs.push('dup id '+q.id); ids.add(q.id);
      if(!q.q || !q.x) errs.push('missing text '+q.id);
      if(!Array.isArray(q.ch) || q.ch.length<2) errs.push('bad choices '+q.id);
      if(typeof q.a!=='number' || q.a<0 || q.a>=q.ch.length) errs.push('bad answer '+q.id);
      if(q.sign && !SIGNMAP[q.sign]) errs.push('bad sign ref '+q.id);
      if(new Set(q.ch).size !== q.ch.length) errs.push('dup choices '+q.id);
      if(!CATS[q.c]) errs.push('bad cat '+q.id);
    });
    SIGNS.forEach(s=>{ if(!s.svg || !s.name || !s.meaning) errs.push('bad sign '+s.id); if(s.svg.indexOf('<')!==0) errs.push('svg malformed '+s.id); });
    MAIN.forEach(sc=>{ S.screen=sc; render(false); });
    ['predrive','maneuvers','scenarios','fails','testday'].forEach(t=>{ S.screen='practical'; S.pTab=t; render(false); });
    MANEUVERS.forEach(m=>{ S.screen='practical'; S.pTab='maneuvers'; S.manOpen=m.id; for(let i=0;i<m.steps.length;i++){ S.manStep=i; render(false);} });
    S.manOpen=null;
    ['grid','flash','quiz'].forEach(t=>{ S.screen='signs'; S.signTab=t; render(false); });
    S.openSign=SIGNS[0].id; S.signTab='grid'; render(false); S.openSign=null;
    startFlash(); S.flash.revealed=true; render(false); flashMark(true);
    startPractice('all');
    for(let k=0;k<3;k++){ answerPractice(0); nextPractice(); }
    startPractice(null, [QDATA[0].id], 'one'); answerPractice(0); nextPractice(); // done view
    startExam();
    let guard=0;
    while(S.exam && !S.exam.done && guard<100){ answerExam(0); guard++; }
    if(!S.exam.done) errs.push('exam did not finish');
    S.exam=null; S.quiz=null; S.screen='home'; render(false);
  }catch(ex){ errs.push('exception: '+(ex && ex.message)); }
  document.title = errs.length ? ('SELFTEST FAIL: '+errs.slice(0,4).join(' | ')) : ('SELFTEST PASS q='+QDATA.length+' signs='+SIGNS.length);
}
</script>
